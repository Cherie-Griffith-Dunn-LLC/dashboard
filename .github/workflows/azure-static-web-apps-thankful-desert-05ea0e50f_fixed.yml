name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

env:
  NPM_CONFIG_LEGACY_PEER_DEPS: true
  MY_ENVIRONMENT: "production"
  REACT_APP_BACKEND_URL: ${{ secrets.REACT_APP_BACKEND_URL }}
  REACT_APP_SUPPORT_ENABLED: ${{ secrets.REACT_APP_SUPPORT_ENABLED }}
  REACT_APP_CUSTOMER_PORTAL_ENABLED: ${{ vars.REACT_APP_CUSTOMER_PORTAL_ENABLED }}
  REACT_APP_PORTAL_API_SCOPE: ${{ vars.REACT_APP_PORTAL_API_SCOPE }}
  REACT_APP_ENTRA_CLIENT_ID: ${{ vars.REACT_APP_ENTRA_CLIENT_ID }}
  REACT_APP_ENTRA_REDIRECT_URI: ${{ vars.REACT_APP_ENTRA_REDIRECT_URI }}
  REACT_APP_DEFAULTAUTH: "jwt"

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install portal API dependencies
        run: npm ci --prefix api --ignore-scripts

      - name: Verify portal tenant boundaries
        run: npm run test:portal --prefix api

      - name: Test portal interface
        run: npm test -- --watchAll=false --runInBand
        env:
          CI: true

      - name: Build React app
        run: npm run build

      - name: Deploy with Azure Static Web Apps CLI
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SWA_CLI_DEPLOYMENT_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_THANKFUL_DESERT_05EA0E50F }}
        run: |
          npm install -g @azure/static-web-apps-cli
          swa deploy ./build --env production
